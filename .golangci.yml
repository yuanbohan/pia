version: "2"

# Keep this list explicit so tool upgrades cannot silently change the quality gate.
# Add linters only when they provide a clear, low-noise rule for this codebase.
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gocheckcompilerdirectives
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
